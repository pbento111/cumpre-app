<title>Cumpre</title>

<style>
/* Layout: app shell — bottom tab bar on phones, fixed side menu from 960px; content column max 1120px. */
:root {
  --bg: #FFFFFF; --surface: #FFFFFF; --sand: #F4F4F2; --line: #E8E8E5; --line-strong: #8D8D88;
  --ink: #111111; --muted: #55554F; --heading: #111111;
  --btn: #111111; --btn-ink: #FFFFFF; --btn-hover: #2A2A2A;
  --accent: #FF6B4A; --on-accent: #111111;
  --soft: #F3F2EF; --on-soft: #111111;
  --warn: #FDE7E7; --on-warn: #9B1C1C; --warn-text: #C62828; --alert: #D7263D; --on-alert: #FFFFFF;
  --hero: #111111; --hero-ink: #FFFFFF; --hero-muted: #D9D9D4; --hero-track: #3A3A3A;
  --focus: #111111;
  --c1: #FFE9E2; --c2: #FFF3C4; --c3: #E3F1FF; --c4: #F1F1EE; --c5: #E2F5EA; --c6: #F0E8FF;
  --overlay: rgba(17, 17, 17, .45);
  --shadow: 0 1px 2px rgba(17, 17, 17, .05), 0 10px 30px rgba(17, 17, 17, .08);
  --display: 'Outfit', 'Avenir Next', 'Segoe UI', system-ui, sans-serif;
  --text: 'Figtree', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --r-sm: 10px; --r: 14px; --r-lg: 20px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0E0E0E; --surface: #181818; --sand: #222221; --line: #2E2E2C; --line-strong: #6E6E69;
  --ink: #F2F2EF; --muted: #A8A8A2; --heading: #FFFFFF;
  --btn: #F2F2EF; --btn-ink: #111111; --btn-hover: #FFFFFF;
  --accent: #FF7A5C; --on-accent: #111111;
  --soft: #232322; --on-soft: #ECECE8;
  --warn: #3A1517; --on-warn: #FFB3B3; --warn-text: #FF7B7B; --alert: #D7263D; --on-alert: #FFFFFF;
  --hero: #232322; --hero-ink: #FFFFFF; --hero-muted: #C4C4BE; --hero-track: #3D3D3A;
  --focus: #FF7A5C;
  --c1: #3A1F18; --c2: #393116; --c3: #172A3A; --c4: #262624; --c5: #173021; --c6: #2A2238;
  --overlay: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
} }
:root[data-theme="dark"] {
  --bg: #0E0E0E; --surface: #181818; --sand: #222221; --line: #2E2E2C; --line-strong: #6E6E69;
  --ink: #F2F2EF; --muted: #A8A8A2; --heading: #FFFFFF;
  --btn: #F2F2EF; --btn-ink: #111111; --btn-hover: #FFFFFF;
  --accent: #FF7A5C; --on-accent: #111111;
  --soft: #232322; --on-soft: #ECECE8;
  --warn: #3A1517; --on-warn: #FFB3B3; --warn-text: #FF7B7B; --alert: #D7263D; --on-alert: #FFFFFF;
  --hero: #232322; --hero-ink: #FFFFFF; --hero-muted: #C4C4BE; --hero-track: #3D3D3A;
  --focus: #FF7A5C;
  --c1: #3A1F18; --c2: #393116; --c3: #172A3A; --c4: #262624; --c5: #173021; --c6: #2A2238;
  --overlay: rgba(0, 0, 0, .6);
  --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 10px 30px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); }
body { color: var(--ink); font-family: var(--text); font-size: 16px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4 { font-family: var(--display); color: var(--heading); margin: 0; font-weight: 600; text-wrap: balance; letter-spacing: -0.01em; }
h1 { font-size: clamp(28px, 4vw, 36px); line-height: 1.15; letter-spacing: -0.02em; }
h2 { font-size: 20px; line-height: 1.25; }
h3 { font-size: 17px; line-height: 1.3; }
p { margin: 0; }
a { color: var(--heading); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 8px; }
.muted { color: var(--muted); }
.small { font-size: 14px; }
.xs { font-size: 13px; }
.num { font-variant-numeric: tabular-nums; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.row { display: flex; align-items: center; gap: 12px; }
.row.wrap { flex-wrap: wrap; }
.between { justify-content: space-between; }
[hidden] { display: none !important; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.stack-lg { display: flex; flex-direction: column; gap: 24px; }
.grow { flex: 1 1 auto; min-width: 0; }
.icon { width: 20px; height: 20px; flex-shrink: 0; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.icon.sm { width: 16px; height: 16px; }
.icon.lg { width: 24px; height: 24px; }

/* Buttons and inputs */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 46px; padding: 0 18px; border-radius: 12px; border: 1px solid transparent; background: var(--btn); color: var(--btn-ink); font-weight: 600; font-size: 15px; text-decoration: none; white-space: nowrap; transition: background .15s; }
.btn:hover { background: var(--btn-hover); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.block { width: 100%; }
.btn.lg { min-height: 54px; font-size: 16px; border-radius: 14px; }
.btn.sm { min-height: 38px; padding: 0 12px; font-size: 14px; border-radius: 10px; }
.btn.ghost { background: var(--surface); color: var(--heading); border-color: var(--line-strong); }
.btn.ghost:hover { background: var(--sand); }
.btn.quiet { background: transparent; color: var(--heading); border-color: transparent; }
.btn.quiet:hover { background: var(--sand); }
.btn.danger { background: var(--warn); color: var(--on-warn); }
.btn.on-hero { background: var(--hero-ink); color: var(--hero); }
.btn.on-hero-ghost { background: transparent; color: var(--hero-ink); border-color: var(--hero-muted); }
.icon-btn { width: 44px; height: 44px; border-radius: 999px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--heading); display: inline-flex; align-items: center; justify-content: center; padding: 0; flex-shrink: 0; }
.icon-btn:hover { background: var(--sand); }
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.field > label, .label { font-size: 14px; font-weight: 600; }
.hint { font-size: 13px; color: var(--muted); }
.input, select.input, textarea.input { width: 100%; min-height: 48px; padding: 10px 14px; border: 1px solid var(--line-strong); border-radius: 12px; background: var(--surface); color: var(--ink); font-size: 16px; }
textarea.input { min-height: 120px; resize: vertical; line-height: 1.55; }
.input::placeholder { color: var(--muted); opacity: .85; }
.input[aria-invalid="true"] { border-color: var(--warn-text); }
.err { color: var(--warn-text); font-size: 14px; font-weight: 600; }
.check { display: flex; align-items: flex-start; gap: 12px; font-size: 15px; line-height: 1.45; cursor: pointer; }
.check input { width: 20px; height: 20px; margin: 1px 0 0; accent-color: var(--heading); flex-shrink: 0; }
.search { position: relative; }
.search .icon { position: absolute; left: 14px; top: 14px; color: var(--muted); pointer-events: none; }
.search .input { padding-left: 42px; }

/* Chips, pills */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { min-height: 44px; padding: 0 16px; border-radius: 12px; border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink); font-size: 15px; font-weight: 500; display: inline-flex; align-items: center; gap: 8px; }
.chip[aria-pressed="true"] { background: var(--btn); color: var(--btn-ink); border-color: var(--btn); font-weight: 600; }
.chip .tag { font-size: 12px; font-weight: 700; padding: 2px 7px; border-radius: 999px; background: var(--accent); color: var(--on-accent); }
.pill { display: inline-flex; align-items: center; gap: 6px; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 600; white-space: nowrap; }
.pill.lime { background: var(--accent); color: var(--on-accent); }
.pill.soft { background: var(--soft); color: var(--on-soft); }
.pill.warn { background: var(--warn); color: var(--on-warn); }
.pill.alerta { background: var(--alert); color: var(--on-alert); }
.pill.sand { background: var(--sand); color: var(--ink); }
.pill.line { border: 1px solid var(--line-strong); color: var(--muted); }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-lg); padding: 20px; min-width: 0; }
.card.tight { padding: 16px; }
.card.flat { background: var(--sand); border-color: transparent; }
.card.soft { background: var(--soft); border-color: transparent; color: var(--on-soft); }
.card.soft h2, .card.soft h3 { color: var(--on-soft); }
.hero { background: var(--hero); color: var(--hero-ink); border-radius: 24px; padding: 22px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.hero h2, .hero h3 { color: var(--hero-ink); }
.hero .muted { color: var(--hero-muted); }
.hero-title { font-family: var(--display); font-size: clamp(26px, 3.4vw, 40px); line-height: 1.12; font-weight: 600; letter-spacing: -0.02em; color: var(--hero-ink); overflow-wrap: anywhere; }
.bar { height: 8px; border-radius: 999px; background: var(--sand); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--heading); }
.hero .bar { background: var(--hero-track); }
.hero .bar > i { background: var(--accent); }
.list { display: flex; flex-direction: column; }
.list > * + * { border-top: 1px solid var(--line); }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; min-width: 0; }
.li-btn { width: 100%; text-align: left; background: transparent; border: 0; color: inherit; padding: 12px 0; display: flex; align-items: center; gap: 12px; min-width: 0; }
.li-btn:hover .li-title { text-decoration: underline; }
.li-title { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
.li-sub { font-size: 13px; color: var(--muted); }
.datebox { width: 50px; height: 54px; flex-shrink: 0; border-radius: 12px; background: var(--sand); display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.05; }
.datebox b { font-size: 19px; font-weight: 700; }
.datebox span { font-size: 12px; font-weight: 600; }
.datebox.warn { background: var(--warn); color: var(--on-warn); }
.datebox.soft { background: var(--soft); color: var(--on-soft); }
.dot { width: 10px; height: 10px; border-radius: 999px; flex-shrink: 0; }
.tile-ico { width: 40px; height: 40px; border-radius: 12px; display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; color: var(--heading); }
.c1 { background: var(--c1); } .c2 { background: var(--c2); } .c3 { background: var(--c3); } .c4 { background: var(--c4); } .c5 { background: var(--c5); } .c6 { background: var(--c6); }
.empty { border: 1.5px dashed var(--line-strong); border-radius: var(--r-lg); padding: 20px; display: flex; flex-direction: column; gap: 10px; align-items: flex-start; }

/* App shell */
.shell { min-height: 100vh; }
.side { display: none; }
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); padding-block: 12px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; align-items: center; gap: 10px; border-bottom: 1px solid transparent; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--bg); }
.brand { font-family: var(--display); font-weight: 600; font-size: 25px; letter-spacing: -0.03em; color: var(--heading); text-decoration: none; background: none; border: 0; padding: 0; }
.points-chip { min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; }
.timer-chip { min-height: 36px; padding: 0 12px; border-radius: 999px; background: var(--hero); color: var(--hero-ink); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; gap: 6px; border: 0; }
.avatar { width: 40px; height: 40px; border-radius: 999px; background: var(--soft); color: var(--on-soft); font-weight: 700; font-size: 14px; display: inline-flex; align-items: center; justify-content: center; border: 0; flex-shrink: 0; overflow: hidden; padding: 0; }
.avatar img { width: 100%; height: 100%; object-fit: cover; display: block; }
.main { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 8px calc(110px + env(safe-area-inset-bottom, 0px)); }
.content { max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 24px; }
.tabbar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding: 8px max(8px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(8px, env(safe-area-inset-left, 0px)); display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); }
.tab { background: none; border: 0; display: flex; flex-direction: column; align-items: center; gap: 4px; color: var(--muted); font-size: 12px; font-weight: 500; padding: 2px 0; min-height: 52px; }
.tab .pillbg { width: 56px; height: 30px; border-radius: 999px; display: flex; align-items: center; justify-content: center; }
.tab[aria-current="page"] { color: var(--heading); font-weight: 700; }
.tab[aria-current="page"] .pillbg { background: var(--accent); color: var(--on-accent); }
.page-head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.grid2 { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); gap: 16px; }
.cols { display: flex; flex-wrap: wrap; gap: 20px; align-items: flex-start; }
.col-main { flex: 2 1 520px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.col-side { flex: 1 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 20px; }
.folders { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: 12px; }
.folder { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; display: flex; flex-direction: column; gap: 10px; min-height: 140px; color: var(--ink); min-width: 0; }
.folder:hover { border-color: var(--line-strong); }
.folder.add { border-style: dashed; border-color: var(--line-strong); background: transparent; align-items: center; justify-content: center; color: var(--heading); font-weight: 600; }
.folder-name { font-weight: 600; font-size: 15px; line-height: 1.3; overflow-wrap: anywhere; }
.seg { display: inline-flex; padding: 4px; gap: 4px; border-radius: 999px; background: var(--sand); max-width: 100%; overflow-x: auto; }
.seg button { min-height: 36px; padding: 0 14px; border-radius: 999px; border: 0; background: transparent; color: var(--muted); font-size: 14px; font-weight: 600; white-space: nowrap; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--heading); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
.section-head { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.link-btn { background: none; border: 0; padding: 4px 0; color: var(--heading); font-weight: 600; font-size: 14px; text-decoration: underline; text-underline-offset: 3px; }

@media (min-width: 960px) {
  .shell { display: grid; grid-template-columns: 248px minmax(0, 1fr); }
  .side { display: flex; flex-direction: column; gap: 28px; position: sticky; top: 0; height: 100vh; padding: 28px 18px; padding-left: max(18px, env(safe-area-inset-left, 0px)); background: var(--surface); border-right: 1px solid var(--line); }
  .side nav { display: flex; flex-direction: column; gap: 4px; }
  .side .navlink { min-height: 46px; padding: 0 12px; border-radius: 12px; display: flex; align-items: center; gap: 12px; color: var(--muted); font-weight: 500; font-size: 15px; background: none; border: 0; text-align: left; }
  .side .navlink:hover { background: var(--sand); }
  .side .navlink[aria-current="page"] { background: var(--accent); color: var(--on-accent); font-weight: 700; }
  .side .me { margin-top: auto; padding: 12px; border-radius: 14px; background: var(--bg); display: flex; align-items: center; gap: 10px; border: 0; text-align: left; color: var(--ink); width: 100%; }
  .tabbar { display: none; }
  .topbar .brand, .topbar .avatar { display: none; }
  .topbar { position: static; padding-top: 24px; justify-content: flex-end; }
  .main { padding-block: 0 56px; padding-left: max(40px, env(safe-area-inset-left, 0px)); padding-right: max(40px, env(safe-area-inset-right, 0px)); }
}

/* Onboarding */
.ob { min-height: 100vh; display: flex; flex-wrap: wrap; }
.ob-aside { flex: 1 1 420px; background: var(--hero); color: var(--hero-ink); padding-block: 40px; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: 24px; display: none; flex-direction: column; justify-content: space-between; gap: 40px; }
.ob-aside .big { font-family: var(--display); font-weight: 600; font-size: clamp(36px, 4.4vw, 54px); line-height: 1.06; letter-spacing: -0.03em; color: var(--hero-ink); }
.ob-aside li { display: flex; gap: 12px; align-items: flex-start; }
.ob-aside .tick { width: 28px; height: 28px; border-radius: 999px; background: var(--accent); color: var(--on-accent); display: inline-flex; align-items: center; justify-content: center; flex-shrink: 0; }
.ob-main { flex: 1 1 480px; min-width: 0; padding-block: 24px 40px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; justify-content: center; }
.ob-form { width: 100%; max-width: 520px; display: flex; flex-direction: column; gap: 22px; }
.steps { display: flex; gap: 6px; }
.steps i { flex: 1; height: 5px; border-radius: 999px; background: var(--sand); }
.steps i.on { background: var(--heading); }
.ob-foot { display: flex; gap: 10px; position: sticky; bottom: 0; padding-block: 12px calc(12px + env(safe-area-inset-bottom, 0px)); background: var(--bg); }
.ob-foot .btn { flex: 1; }
.pick-list { display: flex; flex-direction: column; gap: 8px; max-height: 420px; overflow-y: auto; padding: 2px; }
.pick { text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; gap: 12px; align-items: center; color: var(--ink); min-height: 56px; width: 100%; }
.pick:hover { border-color: var(--line-strong); }
.pick[aria-pressed="true"] { border: 2px solid var(--heading); padding: 11px 13px; }
.pick .radio { width: 20px; height: 20px; border-radius: 999px; border: 2px solid var(--line-strong); flex-shrink: 0; }
.pick[aria-pressed="true"] .radio { border: 6px solid var(--heading); }
.notice { border-radius: 14px; padding: 14px 16px; background: var(--soft); color: var(--on-soft); display: flex; gap: 12px; align-items: flex-start; font-size: 14px; line-height: 1.5; }
.notice.warn { background: var(--warn); color: var(--on-warn); }
.summary dt { font-size: 13px; color: var(--muted); }
.summary dd { margin: 0 0 12px; font-weight: 600; overflow-wrap: anywhere; }
@media (min-width: 960px) {
  .ob-aside { display: flex; padding-left: max(56px, env(safe-area-inset-left, 0px)); padding-right: 56px; padding-block: 48px; }
  .ob-main { align-items: center; padding-block: 48px; }
  .ob-mobile-brand { display: none; }
}

/* Sheet / modal */
.overlay { position: fixed; inset: 0; z-index: 50; background: var(--overlay); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; border-radius: 24px 24px 0 0; padding: 20px max(18px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); display: flex; flex-direction: column; gap: 18px; box-shadow: var(--shadow); }
@media (min-width: 700px) { .overlay { align-items: center; padding: 24px; } .sheet { border-radius: 24px; padding: 28px; } }
.sheet-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }

.lh-linha.off { opacity: .5; }

function anoSugerido(nasc) {
  if (!nasc) return null;
  var b = parseISO(nasc), t = new Date();
  var inicio = t.getMonth() >= 8 ? t.getFullYear() : t.getFullYear() - 1;
  var ano = inicio - b.getFullYear() - 5;
  if (b.getMonth() > 8 || (b.getMonth() === 8 && b.getDate() > 15)) ano -= 1;
  if (ano < 1) return { nivel: null, ano: null };
  if (ano > 12) return { nivel: 'U', ano: Math.min(ano - 12, 5) };
  return { nivel: nivelDoAno(ano), ano: ano };
}

    S.perfil.nome = dn; S.perfil.email = de; S.perfil.nasc = dd; guardar(); fechar(); rerender(); toast('Dados guardados.');
  }
});

/* Arrastar ficheiros para a zona de anexos de um resumo, no computador. */
['dragover', 'dragleave', 'drop'].forEach(function (ev) {
  document.addEventListener(ev, function (e) {
    var z = e.target.closest && e.target.closest('.drop-zona');
    if (!z) return;
    e.preventDefault();
    z.classList.toggle('drop', ev === 'dragover'); z.classList.toggle('over', ev === 'dragover');
    if (ev === 'drop' && e.dataTransfer && e.dataTransfer.files.length) anexarFicheiros(e.dataTransfer.files, { nota: z.dataset.nota });
  });
});

/* Atualiza o relógio do temporizador sem redesenhar a página. */
setInterval(function () {
  if (!S.timer) return;
  var ft = $('[data-foco-tempo]'), fb = $('[data-foco-barra]'), fh = $('[data-hora]');
  if (fh) fh.textContent = agoraHM();
  if (focoAcabou() && !S.timer.avisado) { S.timer.avisado = 1; try { if (navigator.vibrate) navigator.vibrate([200, 100, 200]); } catch (e) {} renderFoco(); rerender(); return; }
  if (ft && !focoAcabou()) ft.textContent = tempoTimer();
  if (fb) fb.style.width = Math.min(100, Math.round(focoSeg() * 100 / ((S.timer.dur || 25) * 60))) + '%';
  if (!focoAcabou()) document.querySelectorAll('[data-tempo]').forEach(function (el) { el.textContent = tempoTimer(); });
}, 1000);

/* ---------- Arranque ---------- */
var h = (location.hash || '').replace('#', '');
if (['hoje', 'pastas', 'loja', 'progresso', 'perfil', 'media'].indexOf(h) >= 0) UI.view = h;
if (ONLINE) arrancarOnline();
else {
  var guardado = lerLocal();
  if (guardado) S = normalizar(guardado);
  retomarFoco();
  render();
  if (presencaDiaria() | verPedidos()) rerender();
  ligarConta();
}
})();
</script>
</body>
